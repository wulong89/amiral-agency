<style>
:root{--blue:#2563eb;--blue-d:#1d4ed8;--ink:#0b1220;--muted:#5b6475;--soft:#e1e9fd;--soft-2:#f3f6ff;--line:#e3e8f4;--bg:#ffffff;--display:'Archivo',system-ui,sans-serif;--text:'Inter',system-ui,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.7 var(--text);overflow-x:clip}
img{max-width:100%;height:auto;display:block}
a{color:var(--blue)}
.wrap{width:min(1120px,100% - 32px);margin-inline:auto}

.logo span{font-weight:600;color:var(--blue)}
.top nav{display:flex;align-items:center;gap:18px}
.top nav a{font:600 15px/1 var(--text);color:var(--ink);text-decoration:none}
.top nav a[aria-current]{color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;background:var(--blue);color:#fff !important;font:700 15px/1 var(--text);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--blue-d)}
.top .btn{min-height:40px;padding:0 16px}
@media (max-width:560px){.top nav .hide-sm{display:none}}
/* index */
.hero{padding:56px 0 28px}
.eyebrow{display:inline-block;font:700 13px/1 var(--text);letter-spacing:.12em;text-transform:uppercase;color:var(--blue);background:var(--soft);padding:7px 12px;border-radius:999px}
h1{font:800 clamp(32px,6vw,52px)/1.08 var(--display);letter-spacing:-.02em;margin:16px 0 12px}
h1 .hl{background:linear-gradient(transparent 58%,var(--soft) 58%)}
.hero p{color:var(--muted);max-width:620px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;padding:18px 0 72px}
.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:20px;overflow:hidden;text-decoration:none;color:inherit;background:#fff;transition:transform .2s,box-shadow .2s,border-color .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(37,99,235,.12);border-color:#c9d8fb}
.card .ph{aspect-ratio:16/9;background:var(--soft-2);overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .in{display:flex;flex-direction:column;gap:10px;padding:20px 22px 22px;flex:1}
.cat{font:700 12px/1 var(--text);letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.card h2{font:700 21px/1.3 var(--display);margin:0}
.card p{margin:0;color:var(--muted);font-size:15.5px;line-height:1.6}
.read{margin-top:auto;padding-top:8px;font:700 15px/1 var(--text);color:var(--blue)}
.card:hover .read span{margin-left:4px}
.read span{display:inline-block;transition:margin .2s}
.meta{display:flex;justify-content:space-between;margin-top:auto;padding-top:8px;color:var(--muted);font-size:14px}
/* article */
.crumbs{font-size:14px;color:var(--muted);padding-top:26px}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--blue)}
.art{width:min(760px,100% - 32px);margin-inline:auto}
.art header{padding:18px 0 8px}
.art .meta{justify-content:flex-start;flex-wrap:wrap;gap:4px 18px;margin:4px 0 0;padding:0}
.art .meta>*{white-space:nowrap}
.cover{margin:22px 0 8px;border-radius:20px;overflow:hidden;background:var(--soft-2);border:1px solid var(--line)}
.cover img{width:100%;max-height:440px;object-fit:contain}
.prose h2{font:800 clamp(23px,3.4vw,29px)/1.25 var(--display);letter-spacing:-.01em;margin:44px 0 12px}
.prose p,.prose li{color:#1e2636}
.prose .lede{font-size:19px;line-height:1.65;color:var(--ink)}
.prose ul,.prose ol{padding-left:1.3em}
.prose li{margin:.35em 0}
.prose li::marker{color:var(--blue);font-weight:700}
.prose blockquote{margin:18px 0;padding:14px 20px;border-left:4px solid var(--blue);background:var(--soft-2);border-radius:0 14px 14px 0;font-weight:600}
.prose figure{margin:30px 0}
.prose figure img{border-radius:16px;border:1px solid var(--line);margin-inline:auto;max-height:560px;width:auto}
.prose figcaption{font-size:14px;color:var(--muted);text-align:center;margin-top:10px}
.cta{margin:52px 0 10px;padding:30px 26px;border-radius:24px;background:var(--blue);color:#fff;text-align:center}
.cta h2{font:800 26px/1.2 var(--display);margin:0 0 8px;color:#fff}
.cta p{margin:0 0 18px;color:#e1e9fd}
.cta .btn{background:#fff;color:var(--blue) !important}
.cta .btn:hover{background:var(--soft)}
.cta small{display:block;margin-top:12px;color:#c9d8fb}
.more{padding:40px 0 70px}
.more h2{font:800 24px/1.2 var(--display);margin:0 0 16px}
.more .grid{padding:0;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.more .card h3{font:700 17px/1.35 var(--display);margin:0}
/* footer */
.foot{border-top:1px solid var(--line);background:var(--soft-2);padding:28px 0;font-size:14px;color:var(--muted)}
.foot .wrap{display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:space-between;align-items:center}
.foot a{color:var(--muted);text-decoration:none}
.foot a:hover{color:var(--blue)}
.foot nav{display:flex;flex-wrap:wrap;gap:8px 18px}
</style>
